<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <meta
        name="description"
        content="Portfolio profesional de Miguel Flor - QA Tester y Consultor de IA"
    >

    <title>Miguel Flor | QA Tester & AI Consultant</title>

    <link rel="stylesheet" href="css/style.css">
</head>

<body>

    <main class="access-page">

        <section class="access-card">

            <header class="access-header">

                <p class="eyebrow">
                    PORTFOLIO PROFESIONAL
                </p>

                <h1>
                    Miguel Flor
                </h1>

                <p class="subtitle">
                    QA Tester · AI Consultant
                </p>

            </header>


            <section class="intro">

                <h2>
                    Bienvenido
                </h2>

                <p>
                    Para acceder a mi portfolio profesional,
                    completá tus datos de contacto.
                </p>

            </section>


            <form id="accessForm">

                <div class="form-group">

                    <label for="firstName">
                        Nombre
                    </label>

                    <input
                        type="text"
                        id="firstName"
                        name="firstName"
                        placeholder="Ingresá tu nombre"
                        autocomplete="given-name"
                    >

                    <small
                        class="error-message"
                        id="firstNameError">
                    </small>

                </div>


                <div class="form-group">

                    <label for="lastName">
                        Apellido
                    </label>

                    <input
                        type="text"
                        id="lastName"
                        name="lastName"
                        placeholder="Ingresá tu apellido"
                        autocomplete="family-name"
                    >

                    <small
                        class="error-message"
                        id="lastNameError">
                    </small>

                </div>


                <div class="form-group">

                    <label for="email">
                        Email
                    </label>

                    <input
                        type="email"
                        id="email"
                        name="email"
                        placeholder="nombre@email.com"
                        autocomplete="email"
                    >

                    <small
                        class="error-message"
                        id="emailError">
                    </small>

                </div>


                <div class="form-group">

                    <label for="phone">
                        Teléfono
                    </label>

                    <input
                        type="tel"
                        id="phone"
                        name="phone"
                        placeholder="+54 9 11 1234 5678"
                        autocomplete="tel"
                    >

                    <small
                        class="error-message"
                        id="phoneError">
                    </small>

                </div>


                <div class="consent">

                    <input
                        type="checkbox"
                        id="consent"
                        name="consent"
                    >

                    <label for="consent">
                        Acepto el registro de mis datos
                        para acceder al portfolio.
                    </label>

                </div>

                <small
                    class="error-message"
                    id="consentError">
                </small>


                <button
                    type="submit"
                    id="accessButton">

                    Ingresar al portfolio

                </button>

            </form>


            <footer class="access-footer">

                <p>
                    QA · Automation · Python · AI
                </p>

                <span>
                    Portfolio en desarrollo
                </span>

            </footer>

        </section>

    </main>


    <script src="js/app.js"></script>

</body>

</html>
